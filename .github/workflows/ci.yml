name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck --incremental false

      - name: Test
        run: bun test

      - name: Validate test database migration
        run: bun run db:migrate:test

      - name: Validate test database seed
        run: bun run db:seed:test

      - name: Build
        run: bun run build

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload mobile trip context screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-121-mobile-trip-context-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**/mobile-trip-*.png
            test-results/**/anonymous-populated-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload landing viewport screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-110-landing-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/issue-110-landing-*.png
          if-no-files-found: error
          retention-days: 14
