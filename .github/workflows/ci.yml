name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce high and critical dependency audit
        run: bun run audit:dependencies

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run local Foundation Gate
        run: bun run verify:foundation:local

      - name: Upload mobile trip context screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-121-mobile-trip-context-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**/mobile-trip-*.png
            test-results/**/anonymous-populated-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload landing viewport screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-110-landing-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/issue-110-landing-*.png
          if-no-files-found: error
          retention-days: 14

  integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: ask_siargao_issue145
          POSTGRES_USER: ask_siargao_issue145
          POSTGRES_PASSWORD: ask_siargao_issue145_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ask_siargao_issue145 -d ask_siargao_issue145"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    env:
      DATABASE_URL: postgres://ask_siargao_issue145:ask_siargao_issue145_password@127.0.0.1:5432/ask_siargao_issue145
      INTEGRATION_TEST_NAMESPACE: ask_siargao_issue150_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Real PostgreSQL semantic integration suite
        run: bun run test:integration:postgres

  integration-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.1-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      INTEGRATION_TEST_NAMESPACE: ask_siargao_issue150_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Real Redis semantic integration suite
        run: bun run test:integration:redis

  trip-pass-launch-manifest:
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - integration-postgres
      - integration-redis
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Trip Pass launch manifest
        env:
          TRIP_PASS_CHECKOUT_MODE: off
        run: bun run qa:trip-pass-launch -- --write --foundation-ci-gates-passed

      - name: Upload Trip Pass launch manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trip-pass-launch-manifest-${{ github.sha }}
          path: .tmp/trip-pass-launch/trip-pass-launch-manifest-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 14
