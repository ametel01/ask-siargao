services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siargao_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d siargao_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: oven/bun:1
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@db:5432/siargao_portal
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TRUST_PROXY_HEADERS: "false"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - bun-cache:/root/.bun/install/cache
    command: sh -lc "bun install --frozen-lockfile && bun run dev:container"

volumes:
  postgres-data:
  app-node-modules:
  bun-cache:
