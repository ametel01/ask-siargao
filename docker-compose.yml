services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siargao_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d siargao_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ask-siargao-app:latest
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@db:5432/siargao_portal
      APP_RUNTIME: compose-app
      CONTAINER_IMAGE: ask-siargao-app:latest
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: ask-siargao-app
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - app-next-cache:/app/.next
      - app-node-modules:/app/node_modules
      - bun-cache:/root/.bun/install/cache
    command: bun run src/server/container/start-dev-app.ts

volumes:
  postgres-data:
  app-next-cache:
  app-node-modules:
  bun-cache:
